<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pack & Survive — Local Mode</title>
<meta name="description" content="Your apps don’t travel with you. Pack four, survive five stops abroad, and see how you score against a perfect run.">
<meta property="og:title" content="Pack & Survive — can you get around abroad?">
<meta property="og:description" content="60-second game: pack four apps, survive five stops in Shanghai, Seoul or Tokyo.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  :root { --teal: #0E6F68; --paper: #EEF1EC; --ink: #1A1F24; --soft: #56625C; --rule: #C3CCC6; --stamp: #C8372D; --board: #111416; --gold: #E8B36B;
          --g: #2E9E5B; --y: #D99A0B; --o: #E4682A; --r: #C8372D; --good-bg: #E1F2EC; --bad-bg: #FBE5E1; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: #0B5A55; color: var(--ink); font-family: 'Public Sans', sans-serif; min-height: 100vh; }
  ::selection { background: var(--gold); color: var(--ink); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, textarea { font: inherit; }
  :focus-visible { outline: 2.5px solid var(--gold); outline-offset: 2px; }
  #root { max-width: 430px; min-height: 100vh; margin: 0 auto; padding: 20px 18px 48px; background: var(--teal); overflow-x: hidden; }
  .num { font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .ic { width: 46px; height: 46px; border-radius: 11px; flex: none; display: block; box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
  .ic.sim { display: grid; place-items: center; background: #3a3f5c; color: #fff; font: 800 13px/1 'Public Sans', sans-serif; }
  .glyph { width: 46px; height: 46px; border-radius: 11px; flex: none; display: grid; place-items: center; background: #DCE3DE; }
  .glyph svg { width: 24px; height: 24px; stroke-width: 1.9; }

  /* Ticket */
  .tkt { background: var(--paper); border-radius: 16px; padding: 20px; box-shadow: 0 22px 44px -22px rgba(0,0,0,.55); position: relative; }
  .perf { position: relative; margin: 20px -20px; border-top: 2px dashed var(--rule); }
  .perf::before, .perf::after { content: ''; position: absolute; top: -13px; width: 24px; height: 24px; border-radius: 50%; background: var(--teal); }
  .perf::before { left: -12px; } .perf::after { right: -12px; }
  .carrier { display: flex; justify-content: space-between; align-items: center; font: 700 15px/1 'Barlow Condensed', sans-serif; letter-spacing: .06em; text-transform: uppercase; }
  .carrier b { color: var(--teal); font-weight: 800; margin-right: 6px; }
  .fl { font: 600 12px/1 'Barlow Condensed', sans-serif; letter-spacing: .09em; text-transform: uppercase; color: var(--soft); }
  .fv { font: 700 22px/1.1 'Barlow Condensed', sans-serif; margin-top: 3px; }
  h1 { font: 800 62px/.88 'Barlow Condensed', sans-serif; letter-spacing: -.01em; margin: 26px 0 8px; }
  .lede { color: var(--soft); font-size: 16px; line-height: 1.5; max-width: 34ch; }
  .route { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; margin-top: 22px; }
  .code { font: 800 54px/.9 'Barlow Condensed', sans-serif; }
  .code.unknown { color: var(--rule); }
  .flight { border-top: 2px dotted var(--rule); position: relative; height: 2px; }
  .flight svg { position: absolute; left: 50%; top: -12px; transform: translateX(-50%); width: 22px; height: 22px; color: var(--teal); background: var(--paper); padding: 0 2px; }
  .fields { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .btn { display: block; width: 100%; margin-top: 16px; padding: 19px; border-radius: 12px; background: var(--ink); color: var(--paper); font: 700 21px/1 'Barlow Condensed', sans-serif; letter-spacing: .05em; text-transform: uppercase; box-shadow: 0 12px 24px -14px rgba(0,0,0,.6); transition: transform .15s; }
  .btn:active { transform: translateY(1px) scale(.99); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.share { background: var(--gold); color: var(--ink); }
  .btn.outline { background: transparent; box-shadow: none; border: 2px solid #D6ECE9; color: #fff; }
  .link { display: block; margin: 16px auto 0; color: #D6ECE9; text-decoration: underline; text-underline-offset: 3px; font-size: 15px; }

  /* Departures board */
  .board { background: var(--board); border-radius: 14px; padding: 16px 12px; color: var(--gold); }
  .bl { font: 600 12px/1 'Barlow Condensed', sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #8E969B; margin: 0 4px 8px; }
  .bl .flag { font-size: 18px; letter-spacing: 0; vertical-align: -2px; margin-left: 4px; }
  .flaps { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 14px; }
  .flap { width: 30px; height: 44px; background: #1D2327; border-radius: 4px; display: grid; place-items: center; font: 700 30px/1 'Barlow Condensed', sans-serif; position: relative; }
  .flap::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #0A0C0E; }
  .lb { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; padding: 9px 4px; border-top: 1px solid #262C31; font: 700 20px/1 'Barlow Condensed', sans-serif; letter-spacing: .04em; text-transform: uppercase; }
  .lb .me { color: #fff; } .lb small { color: #8E969B; font-size: 12px; letter-spacing: .08em; }
  .nick { display: flex; gap: 8px; margin-top: 12px; }
  .nick input { flex: 1; min-width: 0; background: #1D2327; border: 1px solid #333B41; color: #fff; padding: 12px; border-radius: 8px; font-size: 16px; }
  .nick button { background: var(--gold); color: var(--ink); border-radius: 8px; padding: 0 16px; font: 800 17px/1 'Barlow Condensed', sans-serif; letter-spacing: .06em; text-transform: uppercase; }

  /* Pack */
  .status { display: flex; justify-content: space-between; gap: 8px; background: var(--board); color: var(--gold); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; font: 700 17px/1 'Barlow Condensed', sans-serif; letter-spacing: .06em; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
  .app { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 4px 12px; border-radius: 12px; border: 1.5px dashed transparent; font-size: 12.5px; font-weight: 600; text-align: center; line-height: 1.2; }
  .app.on { border-color: var(--teal); background: #fff; }
  .app .packed { position: absolute; top: 6px; right: 4px; font: 800 10px/1 'Barlow Condensed', sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); border: 1.5px solid var(--teal); border-radius: 3px; padding: 2px 4px; transform: rotate(8deg); }
  .app.off { opacity: .42; }
  .tags { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
  .tags i { width: 40px; height: 22px; border-radius: 4px 11px 11px 4px; border: 1.5px dashed var(--rule); }
  .tags i.full { background: var(--teal); border-color: var(--teal); }

  /* Trip HUD: stopwatch ring + route line */
  .hud { display: flex; align-items: center; gap: 14px; background: var(--board); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; }
  .ring { --deg: 0deg; position: relative; width: 58px; height: 58px; border-radius: 50%; flex: none; display: grid; place-items: center; background: conic-gradient(var(--stamp) var(--deg), #2A3237 0); }
  .ring::before { content: ''; position: absolute; inset: 6px; border-radius: 50%; background: var(--board); }
  .ring span { position: relative; font: 800 15px/1 'Barlow Condensed', sans-serif; color: #fff; }
  .hrail { display: flex; align-items: center; }
  .hrail i { width: 12px; height: 12px; border-radius: 50%; border: 3px solid #56626A; background: var(--board); flex: none; }
  .hrail i.done { border-color: #fff; }
  .hrail i.now { width: 18px; height: 18px; border-color: var(--gold); box-shadow: 0 0 0 5px rgba(232,179,107,.22); }
  .hrail b { flex: 1; height: 4px; background: #2A3237; }
  .hrail b.g { background: var(--g); } .hrail b.y { background: var(--y); } .hrail b.o { background: var(--o); } .hrail b.r { background: var(--r); }
  .hudtxt { margin-top: 9px; display: flex; justify-content: space-between; font: 700 14px/1 'Barlow Condensed', sans-serif; letter-spacing: .06em; text-transform: uppercase; color: #9AA3A8; }
  .hudtxt b { color: var(--gold); }

  /* Moment */
  .scene { font: 700 23px/1.28 'Public Sans', sans-serif; letter-spacing: -.015em; text-wrap: balance; margin-top: 8px; }
  .opts { margin-top: 8px; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 8px; border-top: 1.5px dashed var(--rule); text-align: left; font-weight: 600; font-size: 16.5px; border-radius: 0; }
  .opt:first-child { border-top: 0; }
  button.opt:hover { background: rgba(255,255,255,.6); border-radius: 10px; }
  .opt .tag { margin-left: auto; display: flex; align-items: center; gap: 4px; font: 800 12px/1 'Barlow Condensed', sans-serif; letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; padding: 4px 6px; border-radius: 4px; }
  .opt .tag svg { width: 13px; height: 13px; stroke-width: 2.5; }
  .opt .tag.lock { color: var(--soft); border: 1.5px solid var(--rule); }
  .opt .tag.best { color: #fff; background: var(--g); }
  .opt .tag.dark { color: #fff; background: var(--ink); }
  .opt.isdark .ic { filter: grayscale(1) brightness(.55); }
  .opt .cost { margin-left: auto; font: 800 21px/1 'Barlow Condensed', sans-serif; }
  .opt .tag + .cost { margin-left: 8px; }
  .opt.locked { opacity: .5; cursor: not-allowed; }
  .opt.right, .opt.best { background: var(--good-bg); border-radius: 10px; }
  .opt.right .cost, .opt.best .cost { color: var(--g); }
  .opt.wrong { background: var(--bad-bg); border-radius: 10px; }
  .opt.wrong .cost { color: var(--stamp); }
  .opt.dim { opacity: .45; }
  .outcome { font-size: 16px; line-height: 1.5; }
  .outcome .fv { font-size: 26px; margin-bottom: 4px; }
  .outcome .fv.good { color: var(--g); } .outcome .fv.bad { color: var(--stamp); }
  .outcome .hint { color: var(--soft); font-size: 14px; margin-top: 6px; }

  /* Result */
  .late { display: block; width: fit-content; margin: 2px auto 0; background: var(--stamp); color: #fff; border-radius: 10px; padding: 12px 22px 10px; text-align: center; transform: rotate(-3deg);
          box-shadow: inset 0 0 0 3px rgba(255,255,255,.4), 0 10px 20px -12px rgba(120,20,10,.7); animation: stampin .5s cubic-bezier(.2,1.5,.4,1) .1s both; }
  .late small { display: block; font: 700 15px/1 'Barlow Condensed', sans-serif; letter-spacing: .14em; text-transform: uppercase; }
  .late { padding: 16px 22px 14px; }
  .late .stars { display: flex; justify-content: center; gap: 4px; }
  .late .stars svg { width: 34px; height: 34px; stroke-width: 1.8; color: rgba(255,255,255,.55); }
  .late .stars svg.on { color: #fff; fill: #fff; animation: pop .35s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  .late b { display: block; font: 800 40px/1 'Barlow Condensed', sans-serif; margin-top: 8px; }
  .late em { display: block; font: 600 16px/1.3 'Public Sans', sans-serif; font-style: normal; margin-top: 4px; }
  .late.s5, .late.s4 { background: var(--g); box-shadow: inset 0 0 0 3px rgba(255,255,255,.4), 0 10px 20px -12px rgba(10,80,40,.7); }
  .late.s3 { background: #A86B12; box-shadow: inset 0 0 0 3px rgba(255,255,255,.4), 0 10px 20px -12px rgba(90,50,5,.7); }
  @keyframes stampin { from { transform: rotate(-3deg) scale(1.8); opacity: 0; } to { transform: rotate(-3deg) scale(1); opacity: 1; } }
  .scoreline { display: grid; grid-template-columns: 1fr auto 1fr auto 1.15fr; align-items: end; gap: 6px; margin-top: 20px; text-align: center; }
  .scoreline .op { font: 800 24px/1 'Barlow Condensed', sans-serif; color: var(--soft); padding-bottom: 12px; }
  .scoreline .fv { font-size: 26px; }
  .scoreline .you { background: var(--board); border-radius: 10px; padding: 10px 6px; }
  .scoreline .you .fl, .scoreline .you .fv { color: var(--gold); } .scoreline .you .fv { font-size: 30px; }
  .explain { color: var(--soft); font-size: 13.5px; line-height: 1.45; text-align: center; margin-top: 10px; }
  .verdict { text-align: center; font: 800 28px/1 'Barlow Condensed', sans-serif; margin-top: 16px; }
  .stop { display: grid; grid-template-columns: 20px 1fr auto; gap: 12px; }
  .stop .rl { display: flex; flex-direction: column; align-items: center; }
  .stop .st { width: 14px; height: 14px; border-radius: 50%; border: 3.5px solid var(--teal); background: var(--paper); flex: none; margin-top: 3px; }
  .stop .seg { width: 4px; flex: 1; min-height: 18px; }
  .stop .nm { font-weight: 700; font-size: 15px; padding-bottom: 12px; }
  .stop .nm small { display: block; color: var(--soft); font-weight: 500; font-size: 13px; margin-top: 2px; }
  .stop .nm small svg { width: 12px; height: 12px; fill: var(--gold); color: var(--gold); vertical-align: -1px; }
  .stop .c { font: 800 19px/1 'Barlow Condensed', sans-serif; }
  .wentdark { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; margin: -2px 0 12px; }
  .wentdark svg { width: 15px; height: 15px; }
  .barcode { height: 56px; margin-top: 18px; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 7px, transparent 7px 9px, var(--ink) 9px 10px, transparent 10px 13px, var(--ink) 13px 16px, transparent 16px 17px); }

  /* Forms */
  .form h2 { font: 800 34px/1 'Barlow Condensed', sans-serif; letter-spacing: -.01em; margin-bottom: 10px; text-wrap: balance; }
  .form label { display: block; font-weight: 700; font-size: 15px; margin: 22px 0 8px; }
  .form label span { color: var(--soft); font-weight: 500; }
  .form input, .form textarea { width: 100%; background: #fff; border: 1.5px solid var(--rule); color: var(--ink); padding: 14px; border-radius: 10px; font-size: 16px; }
  .form textarea { min-height: 110px; resize: vertical; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { border: 1.5px solid var(--rule); background: #fff; padding: 9px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; }
  .pill.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .f-btn { display: block; width: 100%; margin-top: 22px; padding: 17px; border-radius: 12px; background: var(--ink); color: var(--paper); font: 700 20px/1 'Barlow Condensed', sans-serif; letter-spacing: .05em; text-transform: uppercase; }
  .f-btn:disabled { opacity: .38; cursor: not-allowed; }
  .f-link { display: block; margin: 16px auto 0; color: var(--soft); text-decoration: underline; text-underline-offset: 3px; font-size: 15px; }
  .f-note { color: var(--soft); font-size: 13px; line-height: 1.45; margin-top: 12px; }

  /* Test-only event log (?debug=1) */
  #ev { position: fixed; bottom: 10px; left: 10px; z-index: 99; max-width: 300px; font: 12px/1.35 ui-monospace, Menlo, monospace; }
  #ev summary { background: #ff3d7f; color: #fff; padding: 6px 10px; border-radius: 999px; cursor: pointer; list-style: none; font-weight: 700; }
  #ev ol { background: #fff; color: #222; max-height: 45vh; overflow: auto; margin-top: 6px; padding: 8px 8px 8px 26px; border-radius: 10px; }
</style>
</head>
<body>
<main id="root"></main>

<script>
const GAME_URL = 'albertzhang24.github.io/local-mode';
const SHEET_URL = '';   // Google Apps Script web-app URL (…/exec). Empty = nothing is saved.
const CONCIERGE = '';   // WhatsApp number for the human concierge test, digits only. Empty = skip that screen.
const PARAMS = new URLSearchParams(location.search);
const CHAT = PARAMS.get('g') || 'direct';
const DEBUG = PARAMS.has('debug');
const PACK_SLOTS = 4;

// ---------- Content (fact-checked 2026-09-29) ----------
// pack: [app, 1 = works | 'limited' = partly works | 'dark' = doesn't work there]. option: l = label, needs = app it requires (locked if not packed) or i = icon, m = minutes lost, o = outcome
const DEST = {
  china: { city: 'Shanghai', country: 'China', code: 'PVG', flag: '🇨🇳',
    pack: [['Alipay', 1], ['DiDi', 1], ['Amap', 1], ['Trip.com', 1], ['Travel eSIM', 1], ['Google Maps', 'limited'], ['Uber', 'dark'], ['Venmo', 'dark'], ['Uber Eats', 'dark']],
    moments: [
      { st: 'Pudong Airport', t: '11pm at Pudong airport. Your hotel is across town.', opts: [
        { l: 'DiDi', needs: 'DiDi', m: 15, o: 'Car at the pickup bay, fare shown upfront.' },
        { l: 'Taxi queue', i: 'car-taxi-front', m: 25, o: 'Runs all night — if you can show the address in Chinese.' },
        { l: 'Walk to the metro', i: 'train-front', m: 45, o: 'The last metro has likely left. Wasted walk.' },
        { l: 'Uber', needs: 'Uber', m: 50, o: 'Uber left China in 2016. Back to the taxi queue.' } ] },
      { st: 'Jianbing stall', t: 'The jianbing stall only takes QR codes.', opts: [
        { l: 'Alipay', needs: 'Alipay', m: 2, o: 'Scan, pay, eat.' },
        { l: 'Cash', i: 'banknote', m: 10, o: 'Legally accepted — but they’re short on change.' },
        { l: 'Your Visa card', i: 'credit-card', m: 25, o: 'No card terminal at a street stall.' },
        { l: 'Venmo', needs: 'Venmo', m: 40, o: 'US-only. Nobody here takes it.' } ] },
      { st: 'The Bund', t: 'Leaving the Bund. Which metro exit gets you home?', opts: [
        { l: 'Amap', needs: 'Amap', m: 5, o: 'Shows the exit, the platform and the walk.' },
        { l: 'Show strangers your hotel card', i: 'id-card', m: 20, o: 'Lots of pointing. You get there eventually.' },
        { l: 'Google Maps', needs: 'Google Maps', m: 30, o: 'Patchy in China, with thin transit data.' },
        { l: 'Wander until you see a sign', i: 'footprints', m: 45, o: 'Wrong side of the river.' } ] },
      { st: 'Train to Suzhou', t: 'Book a train to Suzhou. Tickets are tied to your passport.', opts: [
        { l: 'Trip.com', needs: 'Trip.com', m: 10, o: 'English, foreign card, passport name — done.' },
        { l: '12306 website', i: 'globe', m: 30, o: 'Passport verification first.' },
        { l: 'Station ticket counter', i: 'ticket', m: 45, o: 'A long queue with your passport.' },
        { l: 'Buy from a reseller', i: 'triangle-alert', m: 60, o: 'Tickets are real-name. It won’t get you through the gate.' } ] },
      { st: 'Hotel Wi-Fi', t: 'WhatsApp won’t load on the hotel Wi-Fi.', opts: [
        { l: 'Travel eSIM', needs: 'Travel eSIM', m: 5, o: 'Roaming data usually routes abroad — your apps load.' },
        { l: 'Turn on US roaming', i: 'signal', m: 10, o: 'Works too — at $10+ a day.' },
        { l: 'Buy a local SIM', i: 'smartphone', m: 40, o: 'Passport registration — and WhatsApp still won’t load.' },
        { l: 'Keep retrying the Wi-Fi', i: 'wifi-off', m: 60, o: 'It won’t load. Your group chat thinks you vanished.' } ] },
    ] },
  korea: { city: 'Seoul', country: 'Korea', code: 'ICN', flag: '🇰🇷',
    pack: [['Naver Map', 1], ['K.ride', 1], ['Uber', 1], ['Papago', 1], ['T-money', 1], ['Google Maps', 'limited'], ['Grab', 'dark'], ['Venmo', 'dark'], ['Uber Eats', 'dark']],
    moments: [
      { st: 'Incheon Airport', t: '12:15am at Incheon. Your hotel is in Myeongdong.', opts: [
        { l: 'K.ride', needs: 'K.ride', m: 10, o: 'Walks you to the pickup zone. Foreign card works.' },
        { l: 'Uber Taxi', needs: 'Uber', m: 18, o: 'Works with your US account — fewer cars.' },
        { l: 'Night bus + transfer', i: 'bus', m: 60, o: 'Home around 2am.' },
        { l: 'Grab', needs: 'Grab', m: 60, o: 'Grab doesn’t run in Korea. Night bus it is.' } ] },
      { st: 'Café run', t: 'Walk to a café ten minutes away.', opts: [
        { l: 'Naver Map', needs: 'Naver Map', m: 3, o: 'Turn-by-turn walking directions in English.' },
        { l: 'Papago the address', needs: 'Papago', m: 25, o: 'You can read it now — but there’s no route.' },
        { l: 'Google Maps', needs: 'Google Maps', m: 30, o: 'No turn-by-turn walking directions in Korea yet.' },
        { l: 'Wander', i: 'footprints', m: 45, o: 'You find three other cafés first.' } ] },
      { st: 'Hongdae, 1am', t: '1am in Hongdae. The subway has stopped.', opts: [
        { l: 'K.ride', needs: 'K.ride', m: 10, o: 'Late-night surcharge, but a car in minutes.' },
        { l: 'Uber Taxi', needs: 'Uber', m: 15, o: 'Works — a slightly longer wait.' },
        { l: 'Hail on the street', i: 'car-taxi-front', m: 45, o: 'Cab after cab flies past, full.' },
        { l: 'Grab', needs: 'Grab', m: 55, o: 'Not in Korea. Back to the curb.' } ] },
      { st: 'Subway gate', t: 'Pay for the subway.', opts: [
        { l: 'T-money app', needs: 'T-money', m: 3, o: 'Foreigner mode — top up with Mastercard or Amex.' },
        { l: 'Ticket machine', i: 'ticket', m: 10, o: 'Takes foreign cards now — one ticket per ride.' },
        { l: 'Walk instead', i: 'footprints', m: 40, o: 'Seoul is bigger than it looks.' },
        { l: 'Venmo', needs: 'Venmo', m: 40, o: 'US-only. Then you walk.' } ] },
      { st: 'BBQ dinner', t: 'The barbecue place has a Korean-only menu.', opts: [
        { l: 'Papago', needs: 'Papago', m: 5, o: 'Camera-translate the menu in seconds.' },
        { l: 'Point at the photos', i: 'image', m: 15, o: 'Mostly right.' },
        { l: 'Ask staff in English', i: 'hand', m: 20, o: 'Friendly — and slow.' },
        { l: 'Order at random', i: 'dices', m: 30, o: 'Surprise: it’s live octopus.' } ] },

function localPlan(d = D()) {
  if (d.plan) return d.plan;
  const names = d.pack.map(p => p[0]); let best = null;
  (function pick(start, cur) {
    if (cur.length === PACK_SLOTS) {
      const idx = d.moments.map(mo => mo.opts.reduce((b, o, i) => usable(o, cur) && (b < 0 || o.m < mo.opts[b].m) ? i : b, -1));
      const total = idx.reduce((t, k, i) => t + d.moments[i].opts[k].m, 0);
      if (!best || total < best.total) best = { pack: cur, idx, total };

// Departures-board flip: every cell cycles letters, settling left to right
function runSpin() {
  const from = 'PHL', to = D().city.toUpperCase();
  const mk = (id, s) => { const el = document.getElementById(id); el.innerHTML = [...s].map(() => '<span class="flap"></span>').join(''); return [...el.children].map((c, i) => [c, s[i]]); };
  const cells = [...mk('flapFrom', from), ...mk('flapTo', to)];
  if (S.spun) { cells.forEach(([c, ch]) => c.textContent = ch); return; }
  const L = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  cells.forEach(([c, ch], i) => { let n = 0; const stop = 10 + i * 2;
    const iv = setInterval(() => { c.textContent = n++ >= stop ? ch : L[Math.random() * 26 | 0];
      if (n > stop) { clearInterval(iv); if (i === cells.length - 1) { S.spun = true; document.getElementById('flagTo').textContent = D().flag; document.getElementById('spingo').style.visibility = 'visible'; } } }, 55); });
}
// Numbers tick from old value to new (ease-out)
function countUps() {
  document.querySelectorAll('[data-count]').forEach(el => {
    const [a, b] = el.dataset.count.split('|').map(Number); if (a === b) return;
    const t0 = performance.now(), step = t => { const k = Math.min(1, (t - t0) / 700), e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmt(Math.round(a + (b - a) * e)); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

// ---------- Actions ----------
function act(name, arg) {
  const val = id => document.getElementById(id)?.value.trim() || '';
  S.bump = false;
  switch (name) {
    case 'spin': S.step = 'spin'; log('spin', { dest: S.dest }); break;
    case 'to-pack': S.step = 'pack'; break;
    case 'pack': S.packed = S.packed.includes(arg) ? S.packed.filter(x => x !== arg) : S.packed.length < PACK_SLOTS ? [...S.packed, arg] : S.packed; break;
    case 'board': S.step = 'moment'; log('pack', { apps: S.packed.join('+'), useful: goodPacks() }); break;
    case 'choose': { const mo = D().moments[S.mi], o = mo.opts[+arg];
      S.picks[S.mi] = { i: +arg, m: o.m }; S.bump = true; log('choice', { stop: S.mi + 1, pick: o.l, min: o.m, best: +arg === bestIdx(mo) }); break; }
    case 'next': S.mi++; if (S.mi === D().moments.length) { S.step = 'signup'; log('finish', { dest: S.dest, lost: lost(), perfect: perfect(), behind: score(), stars: stars(), useful_packed: goodPacks() }); log('ask_shown'); } break;
    case 'pill': { S.form.email = val('email') || S.form.email; const [k, v, multi] = arg.split('|');
      if (multi === '1') S.form[k] = S.form[k].includes(v) ? S.form[k].filter(x => x !== v) : [...S.form[k], v]; else S.form[k] = v; break; }
    case 'submit': S.form.email = val('email'); S.signedUp = true; log('signup', { ...S.form, where: S.form.where.join('+'), needs: S.form.needs.join('+'), dest: S.dest, score: score() });
      S.step = S.form.when === '60d' && CONCIERGE ? 'concierge' : 'story'; break;
    case 'skip': log('ask_skip'); S.step = 'result'; loadBoard(); break;
    case 'concierge': log('concierge_optin', { yes: arg === 'yes' });
      if (arg === 'yes') window.open(`https://wa.me/${CONCIERGE}?text=${encodeURIComponent('Hi Local Mode! I’m traveling to ___ on ___.')}`, '_blank');
      S.step = 'story'; break;
    case 'story': S.story = val('story'); if (!S.story) return; log('story', { text: S.story }); S.step = 'result'; loadBoard(); break;
    case 'story-skip': log('story', { text: '(nothing went wrong)' }); S.step = 'result'; loadBoard(); break;
    case 'cta': S.step = 'signup'; log('cta_tap_late', { score: score() }); break;
    case 'nick': { const n = val('nick'); if (!n) return; S.nick = n.slice(0, 20); log('leaderboard_join', { nick: S.nick, dest: S.dest, stars: stars(), behind: score() }); setTimeout(loadBoard, 2500); break; }
    case 'share': log('share_tap', { method: navigator.share ? 'sheet' : 'whatsapp' });
      if (navigator.share) navigator.share({ text: shareText() }).catch(() => {}); else window.open('https://wa.me/?text=' + encodeURIComponent(shareText()), '_blank'); return;
    case 'restart': log('play_again'); lastDest = S.dest; reset(); break;
  }
  render();
}

const root = document.getElementById('root');
function render() {
  root.innerHTML = SCREENS[S.step]();
  if (S.step === 'spin') runSpin();
  window.lucide?.createIcons();
  countUps();
  if (!S.bump) window.scrollTo(0, 0);
}
root.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && !el.disabled) act(el.dataset.act, el.dataset.arg); });
root.addEventListener('input', e => { if (e.target.id === 'email') { S.form.email = e.target.value.trim();
  const b = root.querySelector('[data-act=submit]'); if (b) b.disabled = !(S.form.email.includes('@') && S.form.when); } });
render();
</script>
